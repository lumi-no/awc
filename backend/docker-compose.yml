services:
  db:
    image: postgres:16
    container_name: tasks-postgres
    environment:
      POSTGRES_DB: tasksdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasks-api
    depends_on:
      - db
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=tasksdb;Username=postgres;Password=postgres
      API_KEY: local-dev-key
      FRONTEND_ORIGIN: http://localhost:5500
    ports:
      - "8080:8080"
