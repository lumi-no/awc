name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: task-manager-api

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/TaskManager.sln

      - name: Format check
        run: dotnet format backend/TaskManager.sln --verify-no-changes
        continue-on-error: true

      - name: Test
        run: dotnet test backend/TaskManager.sln

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t $ECR_REPOSITORY ./backend

      - name: Tag and push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          docker tag $ECR_REPOSITORY:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest
